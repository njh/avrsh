name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compile (${{ matrix.profile }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Profiles are defined in sketch.yaml
        profile:
          - uno
          - nano

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update core index
        run: arduino-cli core update-index

      - name: Compile sketch
        run: arduino-cli compile --profile ${{ matrix.profile }} --warnings all .
