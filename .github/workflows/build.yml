name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run arduino-lint
        uses: arduino/arduino-lint-action@v2
        with:
          project-type: sketch
          compliance: strict

  compile:
    name: Compile (${{ matrix.profile }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Profiles are defined in sketch.yaml
        profile:
          - uno
          - nano

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update core index
        run: arduino-cli core update-index

      - name: Compile sketch
        run: arduino-cli compile --profile ${{ matrix.profile }} --warnings all .
